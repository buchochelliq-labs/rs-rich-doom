# rs-rich-doom: Doom (the GPL engine, through doomgeneric) in the terminal,
# drawn and driven by the rs-rich crates.
#
# The source is GPL-2.0-or-later, because the engine it links is; `license`
# describes this package, which is source. Built binaries are
# GPL-3.0-or-later (LICENSE-GPL-3.0): they also link Apache-2.0-only crates
# (cpal, ring). See docs/licensing.md. rs-rich itself is MIT and is used here
# as an ordinary library dependency.
[package]
name = "rs-rich-doom"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Doom in the terminal: the doomgeneric engine drawn with rs-rich (half blocks, Braille, Kitty, Sixel)"
repository = "https://github.com/buchochelliq-labs/rs-rich-doom"
readme = "README.md"
keywords = ["doom", "terminal", "game", "tui"]
categories = ["games", "command-line-interface"]
rust-version = "1.90"
build = "build.rs"
# No game data is ever packaged: the IWAD is the user's.
exclude = ["*.wad", "*.WAD"]

[lib]
name = "rs_rich_doom"
path = "src/lib.rs"

[[bin]]
name = "rs-rich-doom"
path = "src/main.rs"

[features]
default = ["sound"]
# Sound effects and music through intuiTUIve's audio output (cpal: ALSA on
# Linux, which needs libasound2-dev to build; CoreAudio on macOS; WASAPI on
# Windows); the music is OPL FM synthesis (opl/, Chocolate Doom's OPL
# module and Nuked OPL3).
sound = ["intuituive/audio"]
# PulseAudio and PipeWire's PulseAudio server directly, through cpal's own
# client (no system library), where ALSA's default is not routed to one.
pulse = ["sound", "intuituive/pulse"]

# The rs-rich crates, from crates.io: the 0.0.21 cohort.
[dependencies]
rich = { package = "rs-rich", version = "0.0.11" }
rich-ext = { package = "rs-rich-ext", version = "0.0.18", default-features = false }
rich-art = { package = "rs-rich-art", version = "0.0.14", features = ["kitty", "sixel", "iterm"] }
rich-interact = { package = "rs-rich-interact", version = "0.0.9" }
intuituive = { package = "rs-rich-intuituive", version = "0.0.6" }
clap = { version = "4", features = ["derive"] }
# The system's certificate store first (a corporate or sandbox proxy's CA
# is there), Mozilla's bundled roots as the fallback.
ureq = { version = "3.4", features = ["platform-verifier"] }
# Reading only: flate2 on zlib-rs (Zlib licence), not zopfli (Apache-2.0).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
# The engine is C; Rust's side is the per-frame conversion. Both like -O3.
opt-level = 3
