# cargo-about: the licences the Rust dependencies of a binary may use, for
# THIRD-PARTY-NOTICES (see docs/licensing.md). Install it with
# `cargo install cargo-about --locked --features cli`, then generate with
#
#     cargo about generate --locked --fail about.hbs -o THIRD-PARTY-NOTICES.html
#
# and ship the file with every binary.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Every target a binary is built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true

# This program's own licence (its source), for this crate only.
[rs-rich-doom]
accepted = ["GPL-2.0-or-later"]
